# .github/workflows/all-in-one.yml
# ============================================================
#  CIRRUS — Cloud Android 11, streamed to your browser, tokenless
#  Theme: Mist (soft light)
#  This single workflow bootstraps: KVM + Emulator + ws-scrcpy
#  engine + custom Cirrus web UI + public tunnel (no login/token)
# ============================================================

name: "Cirrus - Android 11 Cloud Phone (Mist Theme)"

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long to keep Cirrus alive (minutes, max ~330)"
        required: false
        default: "320"

permissions:
  contents: read

concurrency:
  group: cirrus-session
  cancel-in-progress: true

env:
  AVD_NAME: cirrus_avd
  ANDROID_API_LEVEL: 30
  SYSTEM_IMAGE: "system-images;android-30;google_apis;x86_64"
  WS_SCRCPY_PORT: 8000
  CIRRUS_PORT: 9000

jobs:
  cirrus:
    name: "Boot Cirrus Cloud Android"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------
      # 1. Enable KVM (hardware acceleration for the emulator)
      # ---------------------------------------------------------
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---------------------------------------------------------
      # 2. Android SDK: cmdline-tools + platform-tools + emulator
      # ---------------------------------------------------------
      - name: Install Android cmdline-tools
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses --sdk_root="$ANDROID_SDK_ROOT" || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "$SYSTEM_IMAGE"

      # ---------------------------------------------------------
      # 3. Create & boot the Android 11 AVD (headless, KVM)
      # ---------------------------------------------------------
      - name: Create Cirrus AVD (Android 11 / API 30)
        run: |
          echo "no" | avdmanager create avd \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE" \
            --device "pixel_4" \
            --force

          CFG="$HOME/.android/avd/${AVD_NAME}.avd/config.ini"
          {
            echo "hw.keyboard=yes"
            echo "hw.gpu.enabled=yes"
            echo "hw.gpu.mode=swiftshader_indirect"
            echo "hw.ramSize=4096"
            echo "disk.dataPartition.size=6G"
            echo "hw.arc=false"
          } >> "$CFG"

      - name: Boot Android 11 emulator (KVM accelerated, headless)
        run: |
          nohup emulator -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on \
            -camera-back none -camera-front none \
            -qemu -enable-kvm > "$HOME/emulator.log" 2>&1 &

          adb start-server
          adb wait-for-device

          echo "Waiting for Android to finish booting..."
          boot_completed=""
          tries=0
          until [ "$boot_completed" = "1" ] || [ $tries -ge 90 ]; do
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            tries=$((tries + 1))
            sleep 5
          done

          if [ "$boot_completed" != "1" ]; then
            echo "Emulator failed to boot in time."
            cat "$HOME/emulator.log"
            exit 1
          fi

          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "✅ Android 11 booted and unlocked."

      # ---------------------------------------------------------
      # 4. Build the streaming/input/clipboard engine (ws-scrcpy)
      # ---------------------------------------------------------
      - name: Clone & build ws-scrcpy engine
        run: |
          git clone --depth 1 https://github.com/NetrisTV/ws-scrcpy.git "$HOME/ws-scrcpy"
          cd "$HOME/ws-scrcpy"
          npm ci
          npm run dist

      - name: Launch ws-scrcpy engine (internal, localhost only)
        run: |
          cd "$HOME/ws-scrcpy"
          cat > config.yaml << 'EOF'
          server:
            port: 8000
            hostname: 127.0.0.1
          EOF
          nohup node dist/index.js > "$HOME/ws-scrcpy.log" 2>&1 &
          sleep 8
          cat "$HOME/ws-scrcpy.log" || true

      # ---------------------------------------------------------
      # 5. Build "Cirrus" — our own web front-end, Mist theme
      # ---------------------------------------------------------
      - name: Build Cirrus Web (Mist theme, custom UI)
        run: |
          mkdir -p "$HOME/cirrus-web/public"
          cd "$HOME/cirrus-web"
          npm init -y > /dev/null
          npm install express http-proxy-middleware > /dev/null

          cat > server.js << 'EOF'
          const express = require('express');
          const path = require('path');
          const { createProxyMiddleware } = require('http-proxy-middleware');

          const app = express();
          const PORT = process.env.CIRRUS_PORT || 9000;
          const TARGET = 'http://127.0.0.1:8000';

          app.use('/stream', createProxyMiddleware({
            target: TARGET,
            changeOrigin: true,
            ws: true,
            pathRewrite: { '^/stream': '' },
          }));

          app.use(express.static(path.join(__dirname, 'public')));

          app.listen(PORT, '0.0.0.0', () => {
            console.log('Cirrus web listening on port ' + PORT);
          });
          EOF

          cat > public/style.css << 'EOF'
          :root{
            --mist-bg:#f4f7fb;
            --mist-panel:#ffffff;
            --mist-accent:#aed0f0;
            --mist-accent-dark:#6fa8d8;
            --mist-text:#33414f;
            --mist-border:#dce7f3;
            --radius:14px;
          }
          *{ box-sizing:border-box; }
          body{
            margin:0;
            font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
            background:linear-gradient(180deg,var(--mist-bg),#eaf1f9);
            color:var(--mist-text);
            height:100vh;
            display:flex;
            flex-direction:column;
          }
          header{
            background:var(--mist-panel);
            padding:14px 22px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            box-shadow:0 2px 8px rgba(50,80,110,0.08);
            border-bottom:1px solid var(--mist-border);
          }
          header h1{ font-size:20px; margin:0; font-weight:600; }
          header h1 span{ color:var(--mist-accent-dark); }
          .toolbar button{
            background:var(--mist-accent);
            border:none;
            color:#1f2d3a;
            padding:8px 16px;
            margin-left:8px;
            border-radius:var(--radius);
            cursor:pointer;
            font-weight:500;
            transition:0.2s;
          }
          .toolbar button:hover{ background:var(--mist-accent-dark); color:#fff; }
          main{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
          }
          #cirrus-frame{
            width:420px;
            height:calc(100vh - 130px);
            max-height:900px;
            border:none;
            border-radius:24px;
            background:#000;
            box-shadow:0 10px 30px rgba(50,80,110,0.18);
          }
          footer{ text-align:center; font-size:12px; color:#7d8fa1; padding:8px; }
          EOF

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Cirrus — Your Cloud Android</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="style.css">
          </head>
          <body>
            <header>
              <h1>☁️ <span>Cirrus</span> — Mist</h1>
              <div class="toolbar">
                <button id="btn-paste">📋 Paste PC → Phone</button>
                <button id="btn-copy">📥 Copy Phone → PC</button>
                <button id="btn-fullscreen">⛶ Fullscreen</button>
              </div>
            </header>
            <main>
              <iframe id="cirrus-frame" src="/stream" allow="clipboard-read; clipboard-write"></iframe>
            </main>
            <footer>Cirrus • Android 11 • Mist Theme • Tokenless Session</footer>
            <script src="app.js"></script>
          </body>
          </html>
          EOF

          cat > public/app.js << 'EOF'
          const frame = document.getElementById('cirrus-frame');

          document.getElementById('btn-fullscreen').onclick = () => {
            if (frame.requestFullscreen) frame.requestFullscreen();
          };

          // PC -> Phone: read PC clipboard, forward into the embedded
          // ws-scrcpy stream, which relays it over the scrcpy control
          // socket to the Android clipboard (auto-synced on device).
          document.getElementById('btn-paste').onclick = async () => {
            try {
              const text = await navigator.clipboard.readText();
              frame.contentWindow.postMessage({ type: 'cirrus-set-clipboard', text }, '*');
              alert('Sent PC clipboard to Cirrus (phone).');
            } catch (e) {
              alert('Clipboard permission denied by browser: ' + e.message);
            }
          };

          // Phone -> PC: pull the last clipboard value tracked by the
          // scrcpy control connection (auto-updated whenever the
          // device copies text).
          document.getElementById('btn-copy').onclick = () => {
            frame.contentWindow.postMessage({ type: 'cirrus-get-clipboard' }, '*');
          };

          window.addEventListener('message', async (ev) => {
            if (ev.data && ev.data.type === 'cirrus-clipboard-data') {
              try {
                await navigator.clipboard.writeText(ev.data.text || '');
                alert('Phone clipboard copied to PC clipboard!');
              } catch (e) {
                console.warn('Could not write to PC clipboard:', e);
              }
            }
          });
          EOF

          nohup node server.js > "$HOME/cirrus-web.log" 2>&1 &
          sleep 3
          cat "$HOME/cirrus-web.log" || true

      # ---------------------------------------------------------
      # 6. Expose Cirrus publicly — tokenless (Cloudflare Quick Tunnel)
      # ---------------------------------------------------------
      - name: Install cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Open tokenless public tunnel to Cirrus
        run: |
          nohup cloudflared tunnel --url http://localhost:$CIRRUS_PORT --no-autoupdate > "$HOME/cloudflared.log" 2>&1 &

          echo "Waiting for public URL..."
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$HOME/cloudflared.log" | head -n1)
            [ -n "$URL" ] && break
            sleep 3
          done

          if [ -z "$URL" ]; then
            echo "Failed to obtain tunnel URL"
            cat "$HOME/cloudflared.log"
            exit 1
          fi

          echo "CIRRUS_URL=$URL" >> $GITHUB_ENV
          {
            echo "## ☁️ Cirrus is LIVE"
            echo ""
            echo "**Open on any PC/phone browser — no login, no token:**"
            echo ""
            echo "### 🔗 $URL"
            echo ""
            echo "- Theme: Mist (soft light)"
            echo "- Android: 11 (API 30)"
            echo "- Session length: ${{ github.event.inputs.session_minutes }} minutes"
          } >> $GITHUB_STEP_SUMMARY
          echo "Cirrus URL => $URL"

      # ---------------------------------------------------------
      # 7. Keep the session alive for the requested duration
      # ---------------------------------------------------------
      - name: Keep Cirrus session alive
        run: |
          MINUTES="${{ github.event.inputs.session_minutes }}"
          [ -z "$MINUTES" ] && MINUTES=320
          TOTAL=$((MINUTES * 60))
          ELAPSED=0
          echo "Cirrus running at: $CIRRUS_URL"
          while [ $ELAPSED -lt $TOTAL ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            if ! pgrep -f "emulator .*-avd $AVD_NAME" > /dev/null; then
              echo "Emulator process died, stopping session."
              break
            fi
            echo "[$((ELAPSED / 60))/$MINUTES min] Cirrus alive at $CIRRUS_URL"
          done

      - name: Session ended
        if: always()
        run: echo "Cirrus session closed. Re-run the workflow (Actions tab) to get a fresh instance + new URL."
