# Cirrus — disposable, browser-operated Android 11+ session
#
# Put this file at .github/workflows/cirrus.yml in a repository, then use
# Actions -> Cirrus Android (Mist) -> Run workflow.  The job summary contains
# the temporary HTTPS URL.  It uses a Cloudflare *Quick Tunnel*: no account,
# token, secret, or login is required.
#
# SECURITY / LIFETIME
# - Anyone who obtains the random URL can operate this emulator. Do not sign in
#   to sensitive accounts or put secrets in it.
# - This is deliberately tokenless and disposable. GitHub-hosted runners and
#   Quick Tunnels end when the job is cancelled or reaches its time limit.
# - The workflow does not expose the runner shell or ADB over the internet;
#   only the Android display/control bridge and clipboard API are published.

name: Cirrus Android (Mist)

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level (30 = Android 11; default 35)"
        required: true
        default: "35"
        type: choice
        options: ["30", "31", "32", "33", "34", "35"]
      minutes:
        description: "How long to keep it online (5–350 minutes)"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

jobs:
  cirrus:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      API_LEVEL: ${{ inputs.api_level }}
      REQUESTED_MINUTES: ${{ inputs.minutes }}
      ANDROID_AVD_HOME: ${{ github.workspace }}/.cirrus-avd
      DISPLAY: :1
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
    steps:
      - name: Validate requested lifetime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_MINUTES" =~ ^[0-9]+$ ]] || { echo "minutes must be numeric"; exit 1; }
          (( REQUESTED_MINUTES >= 5 && REQUESTED_MINUTES <= 350 )) || { echo "minutes must be 5–350"; exit 1; }

      - name: Install the display, VNC, and tiny web gateway
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11vnc x11-xserver-utils python3-aiohttp curl ca-certificates \
            libnss3 libpulse0 libglu1-mesa mesa-utils

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu image includes the Android command-line SDK. Find it
          # rather than relying on a runner-image-specific ANDROID_HOME value.
          SDKMANAGER="$(find "${ANDROID_HOME:-/opt/android-sdk}" /usr/local/lib/android/sdk -path '*/cmdline-tools/latest/bin/sdkmanager' -type f 2>/dev/null | head -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android command-line tools were not found on this runner image." >&2
            exit 1
          fi
          export ANDROID_HOME="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$(dirname "$SDKMANAGER"):$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" "emulator" "platforms;android-${API_LEVEL}" \
            "system-images;android-${API_LEVEL};google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          # 'no' selects no hardware profile prompts and makes this rerunnable.
          echo no | avdmanager create avd --force --name Cirrus \
            --package "system-images;android-${API_LEVEL};google_apis;x86_64" \
            --device pixel_4

      - name: Write Cirrus Mist web application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cirrus/site"
          cat > "$RUNNER_TEMP/cirrus/server.py" <<'PY'
          #!/usr/bin/env python3
          """One-port Cirrus gateway: static Mist UI, RFB-over-WebSocket, clipboard."""
          import asyncio, json, os, shlex, subprocess
          from pathlib import Path
          from aiohttp import web, WSMsgType

          ROOT = Path(os.environ["CIRRUS_SITE"]).resolve()
          NOVNC = Path("/usr/share/novnc").resolve()
          ADB = os.environ.get("ADB", "adb")

          async def index(request):
              return web.FileResponse(ROOT / "index.html")

          async def rfb(request):
              # noVNC talks RFB in binary WebSocket messages; this bridges those
              # messages to x11vnc's loopback-only TCP listener. No shell/ADB is
              # ever reachable from the public tunnel.
              ws = web.WebSocketResponse(autoping=True, heartbeat=25, max_msg_size=0)
              await ws.prepare(request)
              reader, writer = await asyncio.open_connection("127.0.0.1", 5900)
              async def tcp_to_ws():
                  try:
                      while data := await reader.read(65536):
                          await ws.send_bytes(data)
                  finally:
                      if not ws.closed:
                          await ws.close()
              upstream = asyncio.create_task(tcp_to_ws())
              try:
                  async for msg in ws:
                      if msg.type == WSMsgType.BINARY:
                          writer.write(msg.data)
                          await writer.drain()
                      elif msg.type in (WSMsgType.ERROR, WSMsgType.CLOSE, WSMsgType.CLOSED):
                          break
              finally:
                  upstream.cancel()
                  writer.close()
                  try: await writer.wait_closed()
                  except Exception: pass
              return ws

          def adb_clipboard_get():
              # Android's shell ClipboardService command is present on modern API
              # images. Return a benign empty value while the emulator is booting.
              p = subprocess.run([ADB, "shell", "cmd", "clipboard", "get"], text=True,
                                 stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=8)
              return p.stdout.rstrip("\r\n") if p.returncode == 0 else ""

          def adb_clipboard_set(value):
              # shlex.quote makes clipboard text data, never executable shell syntax.
              # Limit avoids accidental giant browser payloads / adb command limits.
              value = value[:100000]
              command = "cmd clipboard set " + shlex.quote(value)
              subprocess.run([ADB, "shell", command], stdout=subprocess.DEVNULL,
                             stderr=subprocess.DEVNULL, timeout=8, check=False)

          async def clipboard(request):
              if request.method == "GET":
                  return web.json_response({"text": await asyncio.to_thread(adb_clipboard_get)})
              try:
                  data = await request.json()
                  value = data.get("text", "")
                  if not isinstance(value, str): raise ValueError("text must be a string")
                  await asyncio.to_thread(adb_clipboard_set, value)
                  return web.json_response({"ok": True})
              except (ValueError, json.JSONDecodeError):
                  return web.json_response({"ok": False, "error": "Invalid clipboard data"}, status=400)

          app = web.Application(client_max_size=110 * 1024)
          app.router.add_get("/", index)
          app.router.add_get("/rfb", rfb)
          app.router.add_get("/api/clipboard", clipboard)
          app.router.add_post("/api/clipboard", clipboard)
          # noVNC is an installed client library, served locally (no third-party JS CDN).
          app.router.add_static("/novnc/", str(NOVNC), show_index=False)
          web.run_app(app, host="127.0.0.1", port=8080, access_log=None)
          PY

          cat > "$RUNNER_TEMP/cirrus/site/index.html" <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Cirrus · Mist</title><style>
          :root{color-scheme:light;--ink:#314254;--muted:#6c7c8c;--line:#d8e4ea;--glass:rgba(255,255,255,.72);--blue:#739bc3;--blue2:#527da9}
          *{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 8%,#fff 0 10%,transparent 39%),radial-gradient(circle at 85% 7%,#cfe2eb 0,transparent 37%),linear-gradient(135deg,#e7eff2,#f8fbfb 48%,#d8e7ee)}
          .shell{max-width:1500px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.brand{font-size:25px;font-weight:700;letter-spacing:.3px}.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#9fc5dd;box-shadow:0 0 20px #8db7d3;margin-right:8px}.mist{color:var(--muted);font-weight:500}.card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 45px rgba(67,95,113,.14);border-radius:20px;overflow:hidden}.bar{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:99px;background:#9bc4ab}.status{font-size:12px;color:var(--muted);margin-right:auto}.btn{border:1px solid #cbdce5;border-radius:10px;padding:8px 11px;background:#fbfdfd;color:var(--ink);font:inherit;cursor:pointer}.btn:hover{background:#eaf4f8}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:var(--blue2)}#screen{width:100%;height:calc(100vh - 160px);min-height:550px;background:#18242d}.foot{display:flex;justify-content:space-between;gap:12px;padding:10px 15px;color:var(--muted);font-size:12px}.warn{color:#806c41}@media(max-width:600px){.shell{padding:10px}.top{margin:4px 3px 10px}.brand{font-size:21px}#screen{height:calc(100vh - 195px);min-height:420px}.foot{display:block}.foot span{display:block;margin:3px 0}}</style></head>
          <body><main class="shell"><header class="top"><div class="brand"><i></i>Cirrus <span class="mist">/ Mist</span></div><div class="mist">Android remote workspace</div></header><section class="card"><div class="bar"><span class="dot"></span><span id="state" class="status">Connecting to Android…</span><button class="btn" id="copyPhone">Phone → PC</button><button class="btn primary" id="pastePhone">PC → Phone</button><button class="btn" id="fullscreen">Full screen</button></div><div id="screen"></div><footer class="foot"><span>Click the phone screen, then type with your PC keyboard. Use the clipboard buttons for reliable two-way paste.</span><span class="warn">Temporary public session · do not use sensitive accounts</span></footer></section></main>
          <script type="module">
          import RFB from '/novnc/core/rfb.js';
          const state=document.querySelector('#state'), screen=document.querySelector('#screen');
          const rfb=new RFB(screen, `${location.protocol==='https:'?'wss':'ws'}://${location.host}/rfb`);
          rfb.scaleViewport=true; rfb.resizeSession=false; rfb.showDot=true; rfb.viewOnly=false;
          rfb.addEventListener('connect',()=>state.textContent='Connected · click screen to control');
          rfb.addEventListener('disconnect',e=>state.textContent=e.detail.clean?'Disconnected':'Connection lost — refresh to retry');
          async function api(method, body){const r=await fetch('/api/clipboard',{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Clipboard service unavailable');return r.json()}
          const notice=t=>{state.textContent=t;setTimeout(()=>{if(rfb._rfb_connection_state==='connected')state.textContent='Connected · click screen to control'},2600)};
          document.querySelector('#pastePhone').onclick=async()=>{try{await api('POST',{text:await navigator.clipboard.readText()});notice('PC clipboard sent to phone');}catch(e){notice('Allow clipboard permission, then try again')}};
          document.querySelector('#copyPhone').onclick=async()=>{try{const x=await api('GET');await navigator.clipboard.writeText(x.text||'');notice('Phone clipboard copied to PC');}catch(e){notice('Allow clipboard permission, then try again')}};
          document.querySelector('#fullscreen').onclick=()=>screen.requestFullscreen?.();
          // A normal browser paste event is also forwarded immediately to Android.
          window.addEventListener('paste',async e=>{const t=e.clipboardData?.getData('text/plain');if(t!==undefined){try{await api('POST',{text:t});notice('PC clipboard sent to phone')}catch{}}});
          </script></body></html>
          HTML

      - name: Boot Android and publish the local Mist gateway
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$RUNNER_TEMP/cirrus/logs"
          Xvfb :1 -screen 0 1280x800x24 -ac +extension RANDR >"$RUNNER_TEMP/cirrus/logs/xvfb.log" 2>&1 &
          # x11vnc stays loopback-only; server.py is the only component that bridges it.
          x11vnc -display :1 -localhost -forever -shared -nopw -rfbport 5900 >"$RUNNER_TEMP/cirrus/logs/x11vnc.log" 2>&1 &
          emulator -avd Cirrus -no-snapshot -wipe-data -no-boot-anim -noaudio \
            -gpu swiftshader_indirect -no-metrics >"$RUNNER_TEMP/cirrus/logs/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell settings put secure show_ime_with_hard_keyboard 1 || true
          adb shell input keyevent 82 || true
          CIRRUS_SITE="$RUNNER_TEMP/cirrus/site" python3 "$RUNNER_TEMP/cirrus/server.py" >"$RUNNER_TEMP/cirrus/logs/cirrus.log" 2>&1 &
          # Tokenless Cloudflare Quick Tunnel. Its unguessable URL is intentionally
          # printed only to this workflow's logs and step summary.
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 >"$RUNNER_TEMP/cirrus/logs/tunnel.log" 2>&1 &
          for n in $(seq 1 45); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cirrus/logs/tunnel.log" | head -n1 || true)"
            [[ -n "$URL" ]] && break
            sleep 2
          done
          [[ -n "${URL:-}" ]] || { cat "$RUNNER_TEMP/cirrus/logs/tunnel.log"; exit 1; }
          echo "CIRRUS_URL=$URL" >> "$GITHUB_ENV"
          { echo "# ☁️ Cirrus is ready"; echo; echo "## [$URL]($URL)"; echo; echo "Android API ${API_LEVEL}. This is a **tokenless, temporary public URL**; anyone with it can control this disposable phone."; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Cirrus ready::$URL"

      - name: Keep Cirrus online
        shell: bash
        run: |
          set -euo pipefail
          echo "Cirrus is live at: $CIRRUS_URL"
          echo "It will stop after ${REQUESTED_MINUTES} minutes, or immediately if this workflow is cancelled."
          end=$(( $(date +%s) + REQUESTED_MINUTES * 60 ))
          while (( $(date +%s) < end )); do
            # Fail visibly instead of leaving a stale public URL if a critical service dies.
            pgrep -f 'emulator.*-avd Cirrus' >/dev/null || { echo "Emulator exited"; exit 1; }
            pgrep -f 'cloudflared tunnel' >/dev/null || { echo "Tunnel exited"; exit 1; }
            sleep 20
          done

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cirrus-diagnostics
          path: ${{ runner.temp }}/cirrus/logs
          if-no-files-found: ignore
          retention-days: 1
